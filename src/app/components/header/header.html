<header class="sticky top-0 z-40 border-b border-line/70 bg-cream-50/85 backdrop-blur">
  <div
    class="mx-auto flex h-16 max-w-6xl items-center justify-between gap-4 px-4 sm:px-6 lg:h-[4.5rem] lg:px-8"
  >
    <a
      routerLink="/"
      class="inline-flex items-center gap-2.5 rounded-xl"
      aria-label="Foodies, ir al inicio"
      (click)="cerrarMenu()"
    >
      <span
        class="grid size-9 place-items-center rounded-xl bg-brand-500 text-white shadow-card"
        aria-hidden="true"
      >
        <svg
          class="size-5"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M7 3v7a2 2 0 0 0 4 0V3M9 12v9" />
          <path d="M15 3c-1.8 2-2.5 4.2-2.5 6.5S13.2 14 15 16v5" />
        </svg>
      </span>
      <span class="text-lg font-extrabold tracking-tight text-ink-900">
        Foodies<span class="text-brand-600">.</span>
      </span>
    </a>

    <nav class="hidden items-center gap-1 md:flex" aria-label="Navegación principal">
      <a
        routerLink="/resenas/5"
        class="rounded-full px-3 py-2 text-sm font-semibold text-ink-700 transition hover:bg-white/70 hover:text-ink-900"
      >
        Reseñas
      </a>
    </nav>

    <div class="hidden items-center gap-2 md:flex">
      @for (role of activeRoles(); track role) {
        <div
          class="flex items-center gap-1 rounded-full border border-line bg-white/75 py-1 pr-1 pl-3"
        >
          <a
            [routerLink]="portals[role].homePath"
            class="text-sm font-semibold text-ink-700 transition hover:text-ink-900"
          >
            {{ roleLabels[role] }}
          </a>
          <button
            type="button"
            class="grid size-8 place-items-center rounded-full text-ink-500 transition hover:bg-cream-100 hover:text-ink-900"
            [attr.aria-label]="'Cerrar sesión de ' + roleLabels[role]"
            (click)="logout(role)"
          >
            <svg
              class="size-4"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3" />
              <path d="M10 17l5-5-5-5M15 12H3" />
            </svg>
          </button>
        </div>
      } @empty {
        <a
          routerLink="/restaurante/login"
          class="rounded-full px-3 py-2 text-sm font-semibold text-ink-500 transition hover:text-ink-900"
        >
          Para restaurantes
        </a>
        <a
          routerLink="/register"
          class="rounded-full px-4 py-2 text-sm font-semibold text-ink-700 ring-1 ring-line transition hover:bg-white"
        >
          Crear cuenta
        </a>
        <a
          routerLink="/login"
          class="rounded-full bg-ink-900 px-4 py-2 text-sm font-semibold text-white transition hover:bg-ink-700"
        >
          Iniciar sesión
        </a>
      }
    </div>

    <button
      type="button"
      class="grid size-10 place-items-center rounded-full text-ink-700 transition hover:bg-white/70 md:hidden"
      [attr.aria-expanded]="menuAbierto()"
      aria-controls="menu-movil"
      [attr.aria-label]="menuAbierto() ? 'Cerrar menú' : 'Abrir menú'"
      (click)="toggleMenu()"
    >
      @if (menuAbierto()) {
        <svg
          class="size-5"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="M6 6l12 12M18 6 6 18" />
        </svg>
      } @else {
        <svg
          class="size-5"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="M4 7h16M4 12h16M4 17h16" />
        </svg>
      }
    </button>
  </div>

  @if (menuAbierto()) {
    <div id="menu-movil" class="border-t border-line/70 bg-cream-50/95 md:hidden">
      <nav
        class="mx-auto flex max-w-6xl flex-col gap-1 px-4 py-4 sm:px-6"
        aria-label="Navegación móvil"
      >
        <a
          routerLink="/resenas/5"
          class="rounded-xl px-3 py-2.5 text-sm font-semibold text-ink-700 transition hover:bg-white/70"
          (click)="cerrarMenu()"
        >
          Reseñas
        </a>

        @for (role of activeRoles(); track role) {
          <div
            class="flex items-center justify-between gap-3 rounded-xl px-3 py-2 transition hover:bg-white/70"
          >
            <a
              [routerLink]="portals[role].homePath"
              class="text-sm font-semibold text-ink-700"
              (click)="cerrarMenu()"
            >
              {{ roleLabels[role] }}
            </a>
            <button
              type="button"
              class="rounded-full px-3 py-1.5 text-xs font-semibold text-ink-500 transition hover:bg-cream-100 hover:text-ink-900"
              [attr.aria-label]="'Cerrar sesión de ' + roleLabels[role]"
              (click)="logout(role)"
            >
              Cerrar sesión
            </button>
          </div>
        } @empty {
          <a
            routerLink="/login"
            class="rounded-xl bg-ink-900 px-3 py-2.5 text-center text-sm font-semibold text-white"
            (click)="cerrarMenu()"
          >
            Iniciar sesión
          </a>
          <a
            routerLink="/register"
            class="rounded-xl px-3 py-2.5 text-center text-sm font-semibold text-ink-700 ring-1 ring-line"
            (click)="cerrarMenu()"
          >
            Crear cuenta
          </a>
          <a
            routerLink="/restaurante/login"
            class="rounded-xl px-3 py-2.5 text-center text-sm font-semibold text-ink-500"
            (click)="cerrarMenu()"
          >
            Para restaurantes
          </a>
        }
      </nav>
    </div>
  }
</header>
